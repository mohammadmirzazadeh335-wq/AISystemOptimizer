name: Build Minecraft 1.21.11 Stealth Mod

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: minecraft-1.21.11-stealth-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Fabric Mod JAR
        run: |
          set -o pipefail
          if ! ./gradlew build --no-daemon > build.log 2>&1; then
            cat build.log
            ERR_SUMMARY=$(grep -E "error:|Exception|FAILED|What went wrong" -A 3 build.log | tail -n 25 | tr '\n' ' ')
            echo "::error title=Gradle Build Error::$ERR_SUMMARY"
            exit 1
          fi
          cat build.log

      - name: Publish Compiled JAR to Repository Release Folder
        run: |
          mkdir -p release
          cp build/libs/ferritecore-dynamic-1.21.11-2.4.0.jar release/ferritecore-dynamic-1.21.11-2.4.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release/ferritecore-dynamic-1.21.11-2.4.0.jar
          git diff --cached --quiet || (git commit -m "Publish compiled ferritecore-dynamic-1.21.11-2.4.0.jar [skip ci]" && git push origin HEAD:${{ github.ref_name }})

      - name: Upload Compiled JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferritecore-dynamic-1.21.11-jar
          path: |
            minecraft-1.21.11-stealth-mod/build/libs/*.jar
            !minecraft-1.21.11-stealth-mod/build/libs/*-sources.jar
