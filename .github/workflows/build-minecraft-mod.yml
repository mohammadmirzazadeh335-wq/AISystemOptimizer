name: Build Minecraft 1.21.11 Stealth Mod

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-1.21.11-stealth-mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Fabric Mod JAR
        run: ./gradlew build --no-daemon

      - name: Upload Compiled JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferritecore-dynamic-1.21.11-jar
          path: |
            minecraft-1.21.11-stealth-mod/build/libs/*.jar
            !minecraft-1.21.11-stealth-mod/build/libs/*-sources.jar
