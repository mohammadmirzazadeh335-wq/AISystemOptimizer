name: Build Server Help

on:
  push:
    branches:
      - '**'
    paths:
      - 'ServerHelp/**'
      - '.github/workflows/serverhelp-build.yml'
  workflow_dispatch:
    inputs:
      singbox_version:
        description: 'sing-box version to bundle'
        required: false
        default: '1.14.3'
      create_release:
        description: 'Publish a GitHub release with the exe'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ServerHelp.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download tunnel engine (sing-box)
        shell: pwsh
        env:
          SINGBOX_VERSION: ${{ github.event.inputs.singbox_version || '1.14.3' }}
          # sha256 of sing-box-1.14.3-windows-amd64.zip, read from the GitHub release
          # asset digest. The build refuses to bundle an engine that does not match, so a
          # swapped release asset can never end up inside ServerHelp.exe.
          SINGBOX_SHA256: d8b86ef58936dba9230ec6a57ffa4243933f3c14ef4809828b6c553440ed1518
        run: |
          $version = $env:SINGBOX_VERSION
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          Write-Host "Fetching $url"
          $zip = "$env:RUNNER_TEMP\sing-box.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 240
          } catch {
            Start-Sleep -Seconds 5
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 240
          }
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($version -eq '1.14.3') {
            if ($zipHash -ne $env:SINGBOX_SHA256) {
              throw "sing-box $version hash mismatch: got $zipHash, expected $($env:SINGBOX_SHA256)"
            }
            Write-Host "sing-box $version archive verified ($zipHash)"
          } else {
            # a manual version was asked for, so there is no pin for it yet: say the hash so
            # it can be added to SINGBOX_SHA256 instead of failing the run
            Write-Warning "no pinned hash for sing-box $version; archive sha256 is $zipHash"
          }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\singbox" -Force
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\singbox" -Recurse -Filter 'sing-box.exe' |
                 Where-Object { $_.FullName -notmatch 'legacy' } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\singbox" -Recurse -Filter 'sing-box.exe' | Select-Object -First 1 }
          # A release without the engine would need a download on the user's machine, which is
          # exactly what must not happen behind a filtered connection: fail loudly instead.
          if (-not $exe) { throw 'sing-box.exe was not found inside the downloaded archive' }
          New-Item -ItemType Directory -Force -Path 'ServerHelp/src/ServerHelp/vendor' | Out-Null
          Copy-Item $exe.FullName 'ServerHelp/src/ServerHelp/vendor/sing-box.exe' -Force
          $hash = (Get-FileHash 'ServerHelp/src/ServerHelp/vendor/sing-box.exe' -Algorithm SHA256).Hash.ToLower()
          Write-Host "sing-box $version sha256 $hash"
          "sing-box $version sha256: $hash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Download wintun driver
        shell: pwsh
        run: |
          $url = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          # the hash wintun.net publishes for this build (Tailscale pins the same value)
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          $downloaded = $false
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 180
            $downloaded = $true
          } catch {
            Write-Warning "Could not download wintun.dll, the tunnel will need a TUN-less fallback: $_"
          }
          if ($downloaded) {
            $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $expected) { throw "wintun archive hash mismatch: got $got, expected $expected" }
            Write-Host "wintun archive verified ($got)"
          }
          if ($downloaded) {
            try {
            Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wintun" -Force
            $dll = Get-ChildItem -Path "$env:RUNNER_TEMP\wintun" -Recurse -Filter 'wintun.dll' |
                   Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
            if (-not $dll) { throw 'wintun.dll (amd64) missing in the archive' }
            New-Item -ItemType Directory -Force -Path 'ServerHelp/src/ServerHelp/vendor' | Out-Null
            Copy-Item $dll.FullName 'ServerHelp/src/ServerHelp/vendor/wintun.dll' -Force
            $hash = (Get-FileHash 'ServerHelp/src/ServerHelp/vendor/wintun.dll' -Algorithm SHA256).Hash.ToLower()
            Write-Host "wintun 0.14.1 dll sha256 $hash"
            } catch {
              Write-Warning "Could not bundle wintun.dll: $_"
            }
          }

      - name: Restore
        run: dotnet restore ServerHelp/src/ServerHelp/ServerHelp.csproj

      - name: Build
        run: dotnet build ServerHelp/src/ServerHelp/ServerHelp.csproj -c Release -p:Platform=x64 --no-restore -v minimal

      - name: Self test the generated tunnel configurations
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The app writes every configuration it can produce (plain proxy, two hop relay, OpenVPN
        # with the pushed resolvers, DNS only mode) and lets the bundled engine validate them.
        # A schema mistake must break the build here, not on a user's machine mid game.
        run: |
          $exe = Get-ChildItem -Path 'ServerHelp/src/ServerHelp/bin' -Recurse -Filter 'ServerHelp.exe' |
                 Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path 'ServerHelp/src/ServerHelp/bin' -Recurse -Filter 'ServerHelp.exe' | Select-Object -First 1 }
          if (-not $exe) { throw 'ServerHelp.exe was not built' }
          # the engine is embedded in the exe, so the app unpacks it itself.
          # Start-Process with -Wait: PowerShell does not wait for a window application, so calling
          # it with & would return before the test ran and leave the exit code empty.
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest' -PassThru -Wait -NoNewWindow
          $code = $process.ExitCode
          Write-Host "self test exit code: $code"
          # a window application has no console in the build, so the report is read from its file
          $reportPath = Join-Path $env:LOCALAPPDATA 'ServerHelp\selftest.txt'
          if (Test-Path $reportPath) {
            $report = Get-Content $reportPath
          } else {
            $report = @('the self test wrote no report; exit code was ' + $code)
          }
          $report | ForEach-Object { Write-Output $_ }
          $report | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          # every failure becomes an annotation, so it is readable from the run page and the API
          $report | Where-Object { $_ -match '^\s*FAIL' -or $_ -match '^\s*\d+ passed, [1-9]\d* failed' } |
            ForEach-Object { Write-Output "::error::$_" }
          if ($code -ne 0) {
            # the report is also posted as a commit comment: a build failure has to be readable
            # from the API, not only from a job log
            $body = ($report -join "`n")
            $body | Out-File -Encoding utf8 "$env:RUNNER_TEMP\selftest-body.md"
            gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" `
              -f body="Server Help self test failed:`n`n``````n$body`n``````" | Out-Null
            throw "self test failed with exit code $code"
          }

      - name: Collect artefact
        shell: pwsh
        run: |
          $out = 'ServerHelp/src/ServerHelp/bin/x64/Release/net48'
          if (-not (Test-Path $out)) { $out = 'ServerHelp/src/ServerHelp/bin/Release/net48' }
          if (-not (Test-Path "$out/ServerHelp.exe")) {
            $found = Get-ChildItem -Path 'ServerHelp/src/ServerHelp/bin' -Recurse -Filter 'ServerHelp.exe' | Select-Object -First 1
            if (-not $found) { throw 'ServerHelp.exe was not produced' }
            $out = $found.DirectoryName
          }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item "$out/ServerHelp.exe" 'dist/ServerHelp.exe' -Force
          $hash = (Get-FileHash 'dist/ServerHelp.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -Encoding ascii 'dist/ServerHelp.exe.sha256'
          $sizeMb = (Get-Item 'dist/ServerHelp.exe').Length / 1MB
          Write-Host "ServerHelp.exe sha256 $hash"
          Write-Host ("size: {0:N1} MB" -f $sizeMb)
          # The tunnel engine has to be inside the exe (a small file means it was not embedded).
          if ($sizeMb -lt 5) { throw "ServerHelp.exe is only $sizeMb MB - the tunnel engine was not embedded" }

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ServerHelp-exe
          path: |
            dist/ServerHelp.exe
            dist/ServerHelp.exe.sha256

      - name: Publish release
        # Two ways to ask for a downloadable build: the manual dispatch checkbox, or a commit
        # message that carries the [serverhelp-release] marker.
        if: >-
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') ||
          contains(github.event.head_commit.message, '[serverhelp-release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "serverhelp-v1.0.0-${{ github.run_number }}"
          gh release create $tag 'dist/ServerHelp.exe' 'dist/ServerHelp.exe.sha256' `
            --target "${{ github.sha }}" `
            --title "Server Help v1.0.0 (build ${{ github.run_number }})" `
            --latest=false `
            --notes "Server Help — Minecraft server helper: diagnoses the connection, builds a low ping WARP tunnel for the game server only, tunes Windows, then launches the selected version straight into the server.`n`nDownload ServerHelp.exe, then right-click → Run as administrator. SHA-256 is published next to the file.`n`nPersian guide: ServerHelp/README.md"
