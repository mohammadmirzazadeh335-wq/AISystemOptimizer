# Alembic configuration for زرین هرمز (Zarrin Hormoz).
# The actual database URL is resolved in src/pars_erp/migrations/env.py from
# (1) the -x url=... argument, (2) PARSERP_DATABASE_URL, (3) <home>/config.json.
[alembic]
script_location = src/pars_erp/migrations
prepend_sys_path = src
version_path_separator = os
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
