[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pars-erp"
version = "0.1.0"
description = "زرین هرمز (Zarrin Hormoz) - Persian corporate accounting and business management desktop suite (phase 2 financial accounting)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Zarrin Hormoz team" }]
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
pars-erp = "pars_erp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pars_erp = ["resources/fonts/*.ttf", "resources/fonts/*.txt", "resources/icons/*/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["gui: tests that need a working Qt platform plugin"]

[tool.ruff]
line-length = 110
target-version = "py311"
